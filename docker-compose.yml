services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careful2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careful2_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-careful2}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied only on first init of an empty data dir. The app also applies
      # the schema on boot, so an existing volume still gets migrated.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careful2} -d ${POSTGRES_DB:-careful2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nominatim:
        condition: service_started
      osrm:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-careful2}:${POSTGRES_PASSWORD:-careful2_dev_password}@db:5432/${POSTGRES_DB:-careful2}
      PORT: 3001
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@careful2.ca}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      ADMIN_NAME: ${ADMIN_NAME:-Careful2 Admin}
      ORS_API_KEY: ${ORS_API_KEY:-}
      DISTANCE_PROVIDER: ${DISTANCE_PROVIDER:-ors}
      PRICE_BASE: ${PRICE_BASE:-5.00}
      PRICE_PER_KM: ${PRICE_PER_KM:-1.50}
      PRICE_MIN: ${PRICE_MIN:-8.00}
      CURRENCY: ${CURRENCY:-CAD}
      NOMINATIM_URL: http://nominatim:8080
      OSRM_URL: http://osrm:5000
      ONTARIO_VIEWBOX: ${ONTARIO_VIEWBOX:--95.2,41.6,-74.3,56.9}
    ports:
      - "3001:3001"

  # --- Self-hosted geo services (Ontario-only) -----------------------------
  # Both are built from the same one-time OSM extract fetched by
  # scripts/fetch-ontario-osm.sh into data/osm/. See README "Geo services".

  # Address autocomplete / geocoding. Static import, no live replication —
  # this is a fixed Ontario extract, not a continuously-updated mirror.
  nominatim:
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    environment:
      PBF_PATH: /nominatim/data/ontario-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim_dev_password}
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
      FREEZE: "true"
    volumes:
      # Not :ro — the image's own startup script chowns this file before
      # importing, which fails (and crash-loops the container) on a
      # read-only mount.
      - ./data/osm/ontario-latest.osm.pbf:/nominatim/data/ontario-latest.osm.pbf
      - nominatim-data:/var/lib/postgresql/14/main
    shm_size: 1gb
    ports:
      - "8089:8080"

  # Routing engine (distance/time + future matrix for nearest-driver). Graph
  # must be pre-built once via the osrm-build profile — see README.
  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/ontario-latest.osrm"]
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "5000:5000"

  # One-shot graph builder. Not started by `docker compose up`; run explicitly
  # once after fetching the extract:
  #   docker compose --profile setup run --rm osrm-build
  osrm-build:
    image: osrm/osrm-backend
    profiles: ["setup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/ontario-latest.osrm ]; then
          echo "[osrm-build] graph already built in data/osrm/, skipping"
          exit 0
        fi
        cp /osm/ontario-latest.osm.pbf /data/ontario-latest.osm.pbf
        osrm-extract -p /opt/car.lua /data/ontario-latest.osm.pbf
        osrm-partition /data/ontario-latest.osrm
        osrm-customize /data/ontario-latest.osrm
        echo "[osrm-build] done"
    volumes:
      - ./data/osm:/osm:ro
      - ./data/osrm:/data

volumes:
  pgdata:
  nominatim-data:
